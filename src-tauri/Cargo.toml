[package]
name = "bouge"
version = "0.1.0"
description = "Move & eye-break reminders with guided desk exercises"
edition = "2021"

[lib]
name = "bouge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
