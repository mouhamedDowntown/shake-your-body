name: Desktop builds

# Builds the Bouge desktop app for Windows, macOS and Linux and publishes the
# installers as a GitHub pre-release. Run it from the Actions tab ("Run
# workflow"), or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon and Intel in one app
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "Bouge desktop v__VERSION__ (test build)"
          releaseBody: |
            Test build — not code-signed, so your computer will warn the first time:
            - **Windows**: download the `.msi` or `-setup.exe`. On "Windows protected your PC" click **More info → Run anyway**.
            - **macOS**: download the `.dmg`, drag Bouge to Applications. If it says the app "is damaged" or "can't be opened", run `xattr -cr /Applications/Bouge.app` in Terminal, then open it again.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
