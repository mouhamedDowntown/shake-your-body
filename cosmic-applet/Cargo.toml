[package]
name = "bouge-cosmic-applet"
version = "0.1.0"
description = "Bouge countdown in the COSMIC panel"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "applet-token", "tokio", "wayland"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
